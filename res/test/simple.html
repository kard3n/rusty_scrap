<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple HTML Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Just a comment -->
  <h1>Hello, World!</h1>
  <p>Click the button below to see a message in the console.</p>
  <button onclick="sayHello()">Click Me</button>

  <script>
    // This function runs when the button is clicked
    function sayHello() {
      console.log("Hello from JavaScript!");
      alert("Hello from JavaScript!");
    }
  </script>

</body>
</html>
